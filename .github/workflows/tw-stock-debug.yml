name: 台股資料診斷（暫時）
on:
  push:
    branches: [main]
    paths: ["tw-stock/debug/**", ".github/workflows/tw-stock-debug.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tw-stock }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tw-stock/debug/probe.py
      - name: 上傳結果
        run: |
          mkdir -p /tmp/o && cp probe.txt /tmp/o/ && cd /tmp/o
          git init -q -b stock-debug
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe.txt && git commit -q -m probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" stock-debug
